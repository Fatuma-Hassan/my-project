<html>
    <header>
        <title>Technology Usage and Customer Feedback Survey</title>
        <link rel="stylesheet" href="/style.css">
    </header>
    <body>
        <div class="credit">
        <form>
            <h1>A. Personal Information</h1>
            <p>Share your experience with digital services and help us improve technology</p>
            <label>Full Name:</label>
            <input type="text" name="Full Name" id="" placeholder="enter your full name" required>
            <label for="">Email Address:</label>
            <input type="email" name="Email Address" placeholder="enter your email">

            <label for="">Age Group:</label>
            <select name="Age Group" id="">
                <option value=""disabled selected>-- select your age range</option>
                <option value="">18_25</option>
                <option value="">25_30</option>
                <option value="">30_35</option>
                <option value="">35_40</option>
                <option value="">40 and above</option>
            </select>
            <label for="">Gender:</label>
                <select name="Gender" id="">
                    <option value=""disabled selected>-- select your gender</option>
                    <option value="">male</option>
                    <option value="">female</option>
                    <option value="">others</option>
                </select>
            <label for="">County:</label>
                <select name="County" id="">
                    <option value=""disabled selected>-- select your county</option>
                    <option value="">Wajir</option>
                    <option value="">Garissa</option>
                    <option value="">Mandera</option>
                    <option value="">Isiolo</option>
                    <option value="">Marsabit</option>
                    <option value="">Nairobi</option>
                </select>
            <label for="">Occupation</label>
            <select name="Occupation" id="">
                <option value=""disabled selectect>-- select occupation</option>
                <option value="">Farmer</option>
                <option value="">Teacher</option>
                <option value="">Nurse</option>
                <option value="">Others</option>
            </select>
            <h2>B.Technology Usage</h2>
            <label for="">1.Which device do you use most?</label>
            <select name="1.Which device do you use most?" id="">
                <option value=""disabled selected>-- select device</option>
                <option value="">Smartphone</option>
                <option value="">Laptop</option>
                <option value="">Desktop Computer</option>
                <option value="">Tablet</option>
                <option value="">Other</option>
            </select>
            <label for="">2.How often do you use the internet?</label>
            <select name="2.How often do you use the internet?" id="">
                <option value=""disabled selected>-- select time</option>
                <option value="">Everyday</option>
                <option value="">Several times a week</option>
                <option value="">Once a week</option>
                <option value="">Rarely</option>
                <option value="">Never</option>
            </select>
            <label for="">3.What do you mainly use the internet for?</label>
            <select name="3.What do you mainly use the internet for?" id="">
                <option value=""disabled selected>-- select what you use for</option>
                <option value="">Education</option>
                <option value="">Business</option>
                <option value="">Communication</option>
                <option value="">Entertainment</option>
                <option value="">Research</option>
            </select>
            <h2>C.Digital Services</h2>
            <label for="">Which digital services do you use?</label>
            <select name="Which digital services do you use" id="">
            <option value=""disabled selected>-- select digital services</option>
            <option value="">Online Banking</option>
            <option value="">E-learning Platforms</option>
            <option value="">E-commerce</option>
            <option value="">Government Services</option>
            <option value="">Online Job Platforms</option>
            </select>
            <h2>D.Customer Experience</h2>
            <label for="">1.How satisfied are you with internet services?</label>
            <select name="1.How satisfied are you with internet services?" id="">
                <option value=""disabled selected>-- select satisfied</option>
                <option value="">Very Satisfied</option>
                <option value="">Satisfied</option>
                <option value="">Neutral</option>
                <option value="">Dissatisfied</option>
                <option value="">Very Dissatisfied</option>
            </select>
            <label for="">2.Is internet access affordable in your area?</label>
            <input type="radio" name="2.Is internet access affordable in your area?" value="Yes">
            Yes
            <input type="radio" name="2.Is internet access affordable in your area?" value="No">
            No
            <label for="">3.Have you experienced online security challenges?</label>
            <input type="radio" name="3.Have you experienced online security challenges?" value="Yes">
            Yes
            <input type="radio" name="3.Have you experienced online security challenges?" value="No">
            No
            <label for="">4.What digital service do you find most useful?</label>
            <textarea name="" id="" placeholder="enter digital skills you find most"></textarea>
            <label for="">5.What challenges do you face when using digital services?</label>
            <textarea name="" id="" placeholder="enter the challenges you face"></textarea>
            <h2>E.Recommendations</h2>
            <label for="">1.What should technology companies improve?</label>
            <textarea name="" id="" placeholder="enter what companies improve"></textarea>
            <label for="">2.What digital services would you like to see introduced?</label>
            <textarea name="" id="" placeholder="enter services you like"></textarea>
            <label for="">3.Additional comments</label>
            <textarea name="" id="" placeholder="add comments"></textarea>
            <h2>F.Consent</h2>
            <label for="">I agree that my responses may be used for educational research</label>
            <input type="checkbox" required name="I agree that my responses may be used for educational research" id="">
            <button type="Submit Feedback">Submit Feedback</button>
            <button>Reset Form</button>





                

        </form>
    </body>
</html>
